# SPDX-License-Identifier: BSD-3-Clause

# When several annotations match a file, the LAST one in this file wins.
# Order: project-wide defaults first, then third-party exceptions.
#
#   precedence = "closest"  -> a file's own SPDX header wins; this is the fallback
#   precedence = "override" -> this annotation applies even if the file says otherwise

version = 1

# =============================================================================
# 1. Project defaults (Chili.CHIPS)
# =============================================================================

# Everything not listed below: RTL, firmware, build/sim scripts, constraints,
# docs, generated build outputs.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Chili.CHIPS"
SPDX-License-Identifier = "BSD-3-Clause"

# Hardware: backplane design, own KiCad library, PCB docs, photos, test results.
[[annotations]]
path = ["1.pcb/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Chili.CHIPS"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# =============================================================================
# 2. Third-party code and libraries (redistributable under their own licenses)
# =============================================================================

# wyvernSemi co-simulation VIP: VProc, mem_model, pcieVHost, rv32 ISS.
# Our own integration files in rv32/usercode carry their own BSD header,
# which wins (precedence "closest").
[[annotations]]
path = ["5.sim/models/cosim/**", "5.sim/models/pcievhost/**", "5.sim/models/rv32/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2004-2025 Simon Southwell"
SPDX-License-Identifier = "GPL-3.0-or-later"

# KiCad libraries vendored next to our own.
[[annotations]]
path = ["1.pcb/KiCad-library/EEZ-Kicad-libraries/**"]
precedence = "override"
SPDX-FileCopyrightText = "Envox d.o.o."
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["1.pcb/KiCad-library/kicad-stock-lib/**"]
precedence = "override"
SPDX-FileCopyrightText = "KiCad Library Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# PeakRDL-html viewer, generated by "make -f MakefileCSR". The template, scripts
# and styles are PeakRDL-html's; the register content is ours.
[[annotations]]
path = ["4.build/csr_build/generated-files/html/**"]
precedence = "override"
SPDX-FileCopyrightText = "PeakRDL-html contributors"
SPDX-License-Identifier = "LGPL-3.0-only"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/content/**", "4.build/csr_build/generated-files/html/data/**", "4.build/csr_build/generated-files/html/search/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chili.CHIPS"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/css/theme.css"]
precedence = "override"
SPDX-FileCopyrightText = ["PeakRDL-html contributors", "Fonticons, Inc."]
SPDX-License-Identifier = "LGPL-3.0-only AND MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/css/normalize.css"]
precedence = "override"
SPDX-FileCopyrightText = "Nicolas Gallagher and Jonathan Neal"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/js/progressbar.min.js"]
precedence = "override"
SPDX-FileCopyrightText = "Kimmo Brunfeldt"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/FontAwesome/**"]
precedence = "override"
SPDX-FileCopyrightText = "Fonticons, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/Lato/**"]
precedence = "override"
SPDX-FileCopyrightText = "Lukasz Dziedzic"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["4.build/csr_build/generated-files/html/fonts/RobotoSlab/**"]
precedence = "override"
SPDX-FileCopyrightText = "Google Inc."
SPDX-License-Identifier = "Apache-2.0"

# =============================================================================
# 3. Third-party material included for reference only (NOT open-licensed)
# =============================================================================

# AMD/Xilinx example designs, IP configuration and Vivado projects.
[[annotations]]
path = ["2.amd-rtl-with-Vivado-build/*/src/**", "2.amd-rtl-with-Vivado-build/*/ip/**", "2.amd-rtl-with-Vivado-build/*/xbuild.Vivado-v2024.2/**"]
