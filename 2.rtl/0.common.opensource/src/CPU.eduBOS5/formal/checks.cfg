#
# riscv-formal checks for eduBOS5 (run-riscv-formal.sh): RV32I, one
# instruction retired per clock at most, ABC bmc3 (no SMT solver needed).

[options]
isa rv32i
solver bmc3

[depth]
insn            16
reg        6    16
pc_fwd     6    16
pc_bwd     6    16
unique     1  6 16
causal     6    16
ill             16
cover      1    16

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/rvfi_wrapper.sv

[script-sources]
read_slang -D RISCV_FORMAL @slang_defs@ -G TARGET_IS_ASIC=1 --top edubos5 @basedir@/cores/@core@/edubos5_pkg.sv @basedir@/cores/@core@/edubos5_rf.sv @basedir@/cores/@core@/edubos5_alu.sv @basedir@/cores/@core@/edubos5.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
