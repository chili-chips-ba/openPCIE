# Configuration for the rv32 instruction set simulator on VProc node 0 -- the
# "make CPU=iss" build. The make file copies it to iss.cfg with -V set from
# CORE, and the ISS reads iss.cfg. Ignored by the CPU=rtl and CPU=vproc builds.
#
#   -V EDUBOS5STG3 the timing model of the core (CORE=): EDUBOS5STG2,
#                  EDUBOS5STG3 or PICORV32, so the ISS reckons cycles as the RTL does
#   -x / -X        addresses in this window are driven out over the VProc bus
#                  and appear as real transactions in the simulation. That is
#                  the CSR at 0x3000_0000. Everything below it -- the code and
#                  data at 0x0000_0000 -- is served from the ISS's own memory,
#                  which is why instruction fetch costs no simulation time.
#   -H             halt if an illegal instruction is executed
#   -t             the very same firmware.elf the RTL core runs, which make
#                  builds into obj/fw with the short start-up delay (SIM=1)

vusermain0 -V EDUBOS5STG3 -H -x 0x30000000 -X 0x3FFFFFFF -t obj/fw/firmware.elf

