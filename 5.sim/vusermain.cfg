# Configuration for the rv32 instruction set simulator on VProc node 0 -- the
# "make CPU=iss" build. Read by parseArgs() in models/rv32/usercode; ignored
# by the CPU=rtl and CPU=vproc builds.
#
#   -V PICORV32    use the picorv32 instruction timing model, so the ISS
#                  reckons cycles the way the real core would
#   -x / -X        addresses in this window are driven out over the VProc bus
#                  and appear as real transactions in the simulation. That is
#                  the CSR at 0x3000_0000. Everything below it -- the code and
#                  data at 0x0000_0000 -- is served from the ISS's own memory,
#                  which is why instruction fetch costs no simulation time.
#   -H             halt if an illegal instruction is executed
#   -t             the very same firmware.elf the picorv32 runs
#
# Build the firmware first, with the short co-simulation start-up delay:
#   cd ../4.build/sw_build && make SIM=1

vusermain0 -V PICORV32 -H -x 0x30000000 -X 0x3FFFFFFF -t ../4.build/sw_build/firmware.elf

